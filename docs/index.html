<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Vacation Planner</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f0f4f8;
    }
    #login-box {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
      width: 300px;
    }
    #login-box h2 { margin-bottom: 1rem; }
    #login-box input {
      width: 100%;
      padding: 0.6rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      margin-bottom: 1rem;
    }
    #login-box button {
      width: 100%;
      padding: 0.7rem;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    #login-box button:hover { background: #2563eb; }
    #error { color: red; margin-top: 0.5rem; font-size: 0.9rem; }

    #content { display: none; width: 100%; max-width: 900px; padding: 2rem; box-sizing: border-box; }
    #content h1 { text-align: center; color: #3b82f6; margin-bottom: 0.25rem; }
    #content .subtitle { text-align: center; color: #888; margin-bottom: 1.5rem; }
    .dates-banner {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 0.8rem 1.2rem;
      text-align: center;
      color: #1d4ed8;
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }
    .dates-banner strong { font-size: 1.1rem; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    thead { background: #3b82f6; color: white; }
    th, td { padding: 0.9rem 1.2rem; text-align: left; vertical-align: middle; }
    tbody tr:nth-child(even) { background: #f8fafc; }
    tbody tr:hover { background: #eff6ff; }

    .tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .tag {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      border-radius: 20px;
      padding: 0.15rem 0.55rem;
      font-size: 0.78rem;
      white-space: nowrap;
      text-decoration: none;
    }
    .tag:hover {
      background: #dbeafe;
      border-color: #3b82f6;
    }

    .vote-cell { display: flex; align-items: center; gap: 0.5rem; }
    .vote-btn {
      background: none;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      width: 30px;
      height: 30px;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .vote-btn:hover { background: #eff6ff; border-color: #3b82f6; }
    .vote-count {
      font-weight: 600;
      font-size: 1rem;
      min-width: 24px;
      text-align: center;
      color: #1d4ed8;
    }
    .vote-count.negative { color: #ef4444; }
  </style>
</head>
<body>

  <div id="login-box">
    <h2>🌴 Family Vacation Planner</h2>
    <p>Enter the family password to continue</p>
    <input type="password" id="password-input" placeholder="Password" />
    <button onclick="login()">Enter</button>
    <div id="error"></div>
  </div>

  <div id="content">
    <h1>🌴 Family Vacation Planner</h1>
    <p class="subtitle">Our shortlist of destinations</p>
    <div class="dates-banner">
      📅 Travel window: <strong>July 13 – July 26, 2026</strong>
    </div>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Destination</th>
          <th>Country</th>
          <th>Things to Do</th>
          <th>Votes</th>
        </tr>
      </thead>
      <tbody id="destinations-body"></tbody>
    </table>
  </div>

  <script>
    const WORKER = "https://vacation-auth.floydian27.workers.dev";
    let sessionPassword = "";

    function renderDestinations(destinations, votes) {
      const tbody = document.getElementById("destinations-body");
      tbody.innerHTML = destinations.map((d, i) => {
        const count = votes[d.name] || 0;
        return `
          <tr>
            <td>${i + 1}</td>
            <td>${d.name}</td>
            <td>${d.country}</td>
            <td><div class="tags">${d.things.map(t => `<a class="tag" href="https://www.google.com/maps/search/${encodeURIComponent(d.name + ' ' + t)}" target="_blank" rel="noopener">${t}</a>`).join("")}</div></td>
            <td>
              <div class="vote-cell">
                <button class="vote-btn" onclick="vote('${d.name}', 'up')">👍</button>
                <span class="vote-count ${count < 0 ? 'negative' : ''}" id="vote-${i}">${count}</span>
                <button class="vote-btn" onclick="vote('${d.name}', 'down')">👎</button>
              </div>
            </td>
          </tr>
        `;
      }).join("");
    }

    async function login() {
      const password = document.getElementById("password-input").value;
      const errorEl = document.getElementById("error");
      errorEl.textContent = "";

      try {
        const res = await fetch(WORKER, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password })
        });
        const data = await res.json();

        if (data.success) {
          sessionPassword = password;
          document.getElementById("login-box").style.display = "none";
          document.getElementById("content").style.display = "block";
          renderDestinations(data.destinations, data.votes);
        } else {
          errorEl.textContent = "Wrong password. Try again.";
        }
      } catch (e) {
        errorEl.textContent = "Something went wrong. Please try again.";
      }
    }

    async function vote(destination, direction) {
      try {
        const res = await fetch(`${WORKER}/vote`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: sessionPassword, destination, direction })
        });
        const data = await res.json();
        if (data.success) {
          // Update all vote counts from fresh server state
          const tbody = document.getElementById("destinations-body");
          const rows = tbody.querySelectorAll("tr");
          rows.forEach((row, i) => {
            const nameCell = row.cells[1].textContent;
            const countEl = row.querySelector(".vote-count");
            if (countEl && data.votes[nameCell] !== undefined) {
              const count = data.votes[nameCell];
              countEl.textContent = count;
              countEl.className = "vote-count" + (count < 0 ? " negative" : "");
            }
          });
        }
      } catch (e) {
        console.error("Vote failed", e);
      }
    }

    document.getElementById("password-input").addEventListener("keydown", e => {
      if (e.key === "Enter") login();
    });
  </script>

</body>
</html>
