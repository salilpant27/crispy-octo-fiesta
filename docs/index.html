<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Vacation Planner</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f0f4f8;
    }
    #login-box {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
      width: 300px;
    }
    #login-box h2 { margin-bottom: 1rem; }
    #login-box input {
      width: 100%;
      padding: 0.6rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      margin-bottom: 1rem;
    }
    #login-box button {
      width: 100%;
      padding: 0.7rem;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    #login-box button:hover { background: #2563eb; }
    #error { color: red; margin-top: 0.5rem; font-size: 0.9rem; }

    #content { display: none; width: 100%; max-width: 800px; padding: 2rem; box-sizing: border-box; }
    #content h1 { text-align: center; color: #3b82f6; margin-bottom: 0.25rem; }
    #content .subtitle { text-align: center; color: #888; margin-bottom: 2rem; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    thead { background: #3b82f6; color: white; }
    th, td { padding: 0.9rem 1.2rem; text-align: left; }
    tbody tr:nth-child(even) { background: #f8fafc; }
    tbody tr:hover { background: #eff6ff; }
  </style>
</head>
<body>

  <div id="login-box">
    <h2>🌴 Family Vacation Planner</h2>
    <p>Enter the family password to continue</p>
    <input type="password" id="password-input" placeholder="Password" />
    <button onclick="login()">Enter</button>
    <div id="error"></div>
  </div>

  <div id="content">
    <h1>🌴 Family Vacation Planner</h1>
    <p class="subtitle">Our shortlist of destinations</p>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Destination</th>
          <th>Country</th>
        </tr>
      </thead>
      <tbody id="destinations-body"></tbody>
    </table>
  </div>

  <script>
    // ── Edit this list to add/remove destinations ──────────────────────────
    const DESTINATIONS = [
      { name: "Amalfi Coast",   country: "Italy"  },
      { name: "Greece",         country: "Greece" },
      { name: "Sevilla",        country: "Spain"  },
      { name: "Florence",       country: "Italy"  },
      { name: "Cannes",         country: "France" },
      { name: "Finland",        country: "Finland"},
    ];
    // ───────────────────────────────────────────────────────────────────────

    function renderDestinations() {
      const tbody = document.getElementById("destinations-body");
      tbody.innerHTML = DESTINATIONS.map((d, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${d.name}</td>
          <td>${d.country}</td>
        </tr>
      `).join("");
    }

    async function login() {
      const password = document.getElementById("password-input").value;
      const errorEl = document.getElementById("error");
      errorEl.textContent = "";

      try {
        const res = await fetch("https://vacation-auth.floydian27.workers.dev/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password })
        });
        const data = await res.json();

        if (data.success) {
          document.getElementById("login-box").style.display = "none";
          document.getElementById("content").style.display = "block";
          renderDestinations();
        } else {
          errorEl.textContent = "Wrong password. Try again.";
        }
      } catch (e) {
        errorEl.textContent = "Something went wrong. Please try again.";
      }
    }

    document.getElementById("password-input").addEventListener("keydown", e => {
      if (e.key === "Enter") login();
    });
  </script>

</body>
</html>
